name: Daily Data Update

on:
  schedule:
    - cron: "30 22 * * *"   # 22:30 UTC = 5:30pm EST / 6:30pm EDT, after the US close
  workflow_dispatch:        # allow manual triggering too

# Never let two runs write to the database at once (a scheduled run overlapping
# a long manual seed would race on the same tables). Queue a new run until the
# in-flight one finishes rather than cancelling it mid-write.
concurrency:
  group: daily-data
  cancel-in-progress: false

# Needed by the keepalive step, which pushes an occasional dummy commit so the
# scheduled trigger isn't auto-disabled after 60 days of repo inactivity.
permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Python setup
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas python-dotenv cryptography requests websockets psycopg2-binary

      - name: Create data directories
        run: |
          mkdir -p data/trade_level_data
          mkdir -p data/daily_distribution_data/wide
          mkdir -p data/daily_moments_data
          mkdir -p data/orderbook_data
          mkdir -p data/daily_bid_ask_moments_data
          mkdir -p data/daily_bid_ask_distribution_data

      # -----------------------
      # Incremental scrape -> Postgres, then export CSVs for the R conversion.
      # First run (empty DB) seeds full history; later runs pull only new trades.
      # -----------------------
      - name: Incremental scrape into Postgres
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python code/kalshi_scraping/scrape_incremental.py

      # Debug aid: keep the exported trades so an R failure can be reproduced
      # without a re-scrape.
      - name: Upload trade data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-level-data
          path: data/trade_level_data/
          retention-days: 7
          if-no-files-found: ignore

      # -----------------------
      # R setup + convert
      # -----------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          install.packages(c("tidyverse", "lubridate", "matrixStats", "collapse", "DescTools"),
                          repos = c("https://packagemanager.posit.co/cran/__linux__/noble/latest",
                                   "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Run R script to convert to distributions and moments
        run: Rscript code/convert_trades_to_pdfs/data_convert_runner.R

      # -----------------------
      # Load derived moments + distributions into Postgres (the data store the
      # front-end reads). Replaces each series in full.
      # -----------------------
      - name: Load derived data into Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python code/kalshi_scraping/load_derived.py

      # -----------------------
      # Fetch each indicator's realised underlying series from FRED into Postgres
      # (underlying_history) so the front-end can overlay actuals on the
      # market-implied forecasts. Independent of the Kalshi scrape; runs even if
      # the scrape found no new trades.
      # -----------------------
      - name: Fetch FRED realized data
        if: always()
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python code/kalshi_scraping/fetch_fred.py

      # -----------------------
      # Quote-based (bid/ask) distribution — runs LAST, after the trade pipeline
      # and FRED, so a slow/failed order-book scrape can never delay trade data.
      # Each step is if: always() and internally budget/tryCatch-guarded; the
      # scrape only covers recent/open markets with a wall-clock cap.
      # -----------------------
      - name: Scrape order book (bid/ask candlesticks)
        if: always()
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python code/kalshi_scraping/scrape_orderbook.py

      - name: Convert order book to quote distributions
        if: always()
        run: Rscript code/convert_trades_to_pdfs/orderbook_convert_runner.R

      - name: Load quote data into Postgres
        if: always()
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python code/kalshi_scraping/load_derived_quotes.py

      # -----------------------
      # Keep the schedule alive: GitHub disables scheduled workflows after 60
      # days with no repo commits, and our runs only write to Postgres. Push a
      # tiny empty commit ONLY when the repo nears that cutoff (~50 days idle),
      # so the cron is re-armed without spamming history. Uses plain git (no
      # third-party action, which this repo's Actions policy blocks).
      # -----------------------
      - name: Keep scheduled workflow alive
        if: always()
        run: |
          last=$(git log -1 --format=%ct)
          idle_days=$(( ( $(date +%s) - last ) / 86400 ))
          echo "Last commit was ${idle_days} day(s) ago."
          if [ "$idle_days" -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keepalive (re-arm scheduled workflow)"
            git push
          else
            echo "No keepalive commit needed."
          fi
