name: Payrolls probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests cryptography pandas websockets
      - name: Probe payrolls order book
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python code/kalshi_scraping/probe_payrolls.py
