name: Quote refresh

# Manual refresh of the quote-based (bid/ask-midpoint) distribution only: scrape
# the order-book candlesticks (AUTHENTICATED — bid/ask is not returned to
# unauthenticated requests), convert to quote distributions/moments in R, and load
# them into Postgres. Isolated from the heavy trade pipeline so the quote path can
# be re-run and validated on its own.
on:
  workflow_dispatch:

concurrency:
  group: daily-data      # share the daily pipeline's lock — never write concurrently
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas python-dotenv cryptography requests psycopg2-binary

      - name: Create data directories
        run: |
          mkdir -p data/orderbook_data
          mkdir -p data/daily_bid_ask_moments_data
          mkdir -p data/daily_bid_ask_distribution_data

      - name: Scrape order book (bid/ask candlesticks, authenticated)
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
        run: python code/kalshi_scraping/scrape_orderbook.py

      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          install.packages(c("tidyverse", "lubridate", "matrixStats", "collapse", "DescTools"),
                          repos = c("https://packagemanager.posit.co/cran/__linux__/noble/latest",
                                   "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Convert order book to quote distributions
        run: Rscript code/convert_trades_to_pdfs/orderbook_convert_runner.R

      - name: Load quote data into Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: python code/kalshi_scraping/load_derived_quotes.py
