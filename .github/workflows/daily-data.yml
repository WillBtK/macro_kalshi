name: Daily Data Update

on:
  schedule:
    - cron: "5 11 * * *"   # daily, 11:05 UTC
  workflow_dispatch:        # allow manual triggering too

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------
      # Python setup
      # -----------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install pandas python-dotenv cryptography requests websockets psycopg2-binary

      - name: Create data directories
        run: |
          mkdir -p data/trade_level_data
          mkdir -p data/daily_distribution_data/wide
          mkdir -p data/daily_moments_data

      # -----------------------
      # Incremental scrape -> Postgres, then export CSVs for the R conversion.
      # First run (empty DB) seeds full history; later runs pull only new trades.
      # -----------------------
      - name: Incremental scrape into Postgres
        env:
          KALSHI_KEYID: ${{ secrets.KALSHI_KEYID }}
          KALSHI_PRIVATE_KEY: ${{ secrets.KALSHI_PRIVATE_KEY }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python code/kalshi_scraping/scrape_incremental.py

      # Debug aid: keep the exported trades so an R failure can be reproduced
      # without a re-scrape.
      - name: Upload trade data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trade-level-data
          path: data/trade_level_data/
          retention-days: 7
          if-no-files-found: ignore

      # -----------------------
      # R setup + convert
      # -----------------------
      - name: Set up R
        uses: r-lib/actions/setup-r@v2

      - name: Install R dependencies
        run: |
          install.packages(c("tidyverse", "lubridate", "matrixStats", "collapse", "DescTools"),
                          repos = c("https://packagemanager.posit.co/cran/__linux__/noble/latest",
                                   "https://cloud.r-project.org"))
        shell: Rscript {0}

      - name: Run R script to convert to distributions and moments
        run: Rscript code/convert_trades_to_pdfs/data_convert_runner.R

      # -----------------------
      # Load derived moments + distributions into Postgres (the data store the
      # front-end reads). Replaces each series in full.
      # -----------------------
      - name: Load derived data into Postgres
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: python code/kalshi_scraping/load_derived.py
